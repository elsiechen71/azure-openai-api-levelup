<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovation Journey - Gamified Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .phone-container {
            width: 393px;
            height: 852px;
            background: #000;
            border-radius: 50px;
            padding: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
        }
        .screen-container {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 46px;
            overflow: hidden;
            position: relative;
        }
        .status-bar {
            height: 47px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }
        .content-area {
            height: calc(100% - 47px - 83px);
            overflow: hidden;
        }
        .tab-bar {
            height: 83px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 20px;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-item.active {
            color: #667eea;
        }
        .tab-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .tab-item span {
            font-size: 10px;
            font-weight: 500;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .progress-bar {
            position: absolute;
            top: 47px;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255,255,255,0.3);
            z-index: 10;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            transition: width 0.5s ease;
            border-radius: 2px;
        }
        .floating-btn {
            position: fixed;
            bottom: 120px;
            right: 30px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 20;
        }
        .floating-btn:hover {
            transform: scale(1.1);
        }
        .celebration {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 30;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f59e0b;
            animation: confetti-fall 3s linear infinite;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-purple-900 via-blue-900 to-indigo-900">
    <div class="phone-container">
        <div class="screen-container">
            <!-- Status Bar -->
            <div class="status-bar">
                <div class="flex items-center space-x-1">
                    <span>9:41</span>
                </div>
                <div class="flex items-center space-x-1">
                    <i class="fas fa-signal"></i>
                    <i class="fas fa-wifi"></i>
                    <i class="fas fa-battery-three-quarters"></i>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <iframe id="contentFrame" src="welcome.html"></iframe>
            </div>

            <!-- Tab Bar -->
            <div class="tab-bar">
                <div class="tab-item active" onclick="navigateTo('welcome.html', 0)">
                    <i class="fas fa-home"></i>
                    <span>Journey</span>
                </div>
                <div class="tab-item" onclick="navigateTo('profile.html', 1)">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </div>
                <div class="tab-item" onclick="navigateTo('tools.html', 2)">
                    <i class="fas fa-tools"></i>
                    <span>Tools</span>
                </div>
                <div class="tab-item" onclick="navigateTo('achievements.html', 3)">
                    <i class="fas fa-trophy"></i>
                    <span>Awards</span>
                </div>
            </div>

            <!-- Floating Action Button -->
            <div class="floating-btn" onclick="showHelp()">
                <i class="fas fa-question"></i>
            </div>

            <!-- Celebration Effect -->
            <div class="celebration" id="celebration"></div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        const totalSteps = 7;
        let gameProgress = JSON.parse(localStorage.getItem('gameProgress')) || {
            currentStep: 0,
            completedSteps: [],
            selectedTeam: null,
            selectedTools: [],
            achievements: []
        };

        function updateProgress() {
            const progress = (currentStep / totalSteps) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function navigateTo(page, tabIndex = null) {
            document.getElementById('contentFrame').src = page;
            
            if (tabIndex !== null) {
                document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
                document.querySelectorAll('.tab-item')[tabIndex].classList.add('active');
            }
        }

        function nextStep(page, step) {
            if (step > currentStep) {
                currentStep = step;
                gameProgress.currentStep = step;
                gameProgress.completedSteps.push(step - 1);
                localStorage.setItem('gameProgress', JSON.stringify(gameProgress));
            }
            navigateTo(page);
            updateProgress();
            
            // Add achievement sound
            playSound('step');
        }

        function showCelebration() {
            const celebration = document.getElementById('celebration');
            celebration.innerHTML = '';
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.backgroundColor = ['#f59e0b', '#ef4444', '#3b82f6', '#10b981', '#8b5cf6'][Math.floor(Math.random() * 5)];
                celebration.appendChild(confetti);
            }
            
            setTimeout(() => {
                celebration.innerHTML = '';
            }, 4000);
            
            playSound('celebration');
        }

        function playSound(type) {
            // Simulate sound effects with vibration on mobile
            if (navigator.vibrate) {
                if (type === 'step') {
                    navigator.vibrate(50);
                } else if (type === 'celebration') {
                    navigator.vibrate([100, 50, 100, 50, 200]);
                }
            }
        }

        function showHelp() {
            alert('🏝️ Welcome to Innovation Journey!\n\nNavigate through the deserted island adventure to learn about our innovation program. Complete each step to unlock the next phase of your journey from idea to product!');
        }

        function saveProgress(data) {
            gameProgress = { ...gameProgress, ...data };
            localStorage.setItem('gameProgress', JSON.stringify(gameProgress));
        }

        function getProgress() {
            return gameProgress;
        }

        // Initialize
        updateProgress();
        
        // Listen for messages from iframes
        window.addEventListener('message', function(event) {
            if (event.data.action === 'nextStep') {
                nextStep(event.data.page, event.data.step);
            } else if (event.data.action === 'celebrate') {
                showCelebration();
            } else if (event.data.action === 'saveProgress') {
                saveProgress(event.data.data);
            }
        });
    </script>
</body>
</html>
